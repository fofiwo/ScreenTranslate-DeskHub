name: DeskHub build and publish

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build-screen-translate-installer.ps1'
      - '.github/workflows/deskhub-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deskhub-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'fofiwo/ScreenTranslate-DeskHub'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate update and sync behavior
        shell: pwsh
        run: |
          dotnet test src/OverTranslate.Tests -c Release --filter 'FullyQualifiedName~DeskHubUpdateTests|FullyQualifiedName~DeltaAwareUpdateManagerTests|FullyQualifiedName~ReleaseNotesTests|FullyQualifiedName~UnifiedLanSyncTests|FullyQualifiedName~LibrarySyncTests|FullyQualifiedName~InstallationDataTests|FullyQualifiedName~SnipDocumentTests|FullyQualifiedName~HotkeyBindingsTests' --logger 'console;verbosity=minimal'
          if ($LASTEXITCODE -ne 0) { throw 'Required tests failed' }
      - name: Install pinned packaging tool
        shell: pwsh
        run: |
          dotnet tool install vpk --version 1.2.0 --tool-path .tools/velopack
          if ($LASTEXITCODE -ne 0) { throw 'Packaging tool install failed' }
      - name: Validate update entry interactions
        shell: pwsh
        env:
          SCREEN_TRANSLATE_UPDATE_ONLY: '1'
        run: |
          dotnet test src/ScreenTranslate.UiTests -c Release --filter ProductShellStartsWithCaptureAndKeepsAllDestinationsReachable --logger 'console;verbosity=minimal'
          if ($LASTEXITCODE -ne 0) { throw 'Update entry acceptance failed' }
      - name: Build clean installer and update feed
        shell: pwsh
        run: |
          # 0.3.6 已用于本机安装；从下一补丁号发布，避免同版本无法升级。
          $version = '0.3.' + ([int]'${{ github.run_number }}' + 1)
          ./build-screen-translate-installer.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Publish complete stable release
        shell: pwsh
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $notes = @'
          ScreenTranslate DeskHub 安装版，适用于 Windows x64。

          - 新增独立截图与标注，支持矩形框选、移动缩放、矩形、箭头、画笔、文字和马赛克。
          - 新增截图贴图和剪贴板图片贴图，支持多张置顶、拖动、缩放和复制。
          - 新增原始屏幕取色，显示 HEX／RGB 并复制色值。
          - 重做截图浮层，采用 Lucide 图标、中文提示和按需展开的颜色／粗细选项；截图和贴图快捷键可在设置中修改。
          - 安装包不包含开发者的用户数据；升级保留独立数据目录。

          首次使用请下载 ScreenTranslate-win-Setup.exe。已有早期本地版需手动安装一次，之后可在应用内更新。
          模型同步包含 API Key；仅与自己的可信设备配对。未签名安装包可能触发 Windows 发布者提示。
          '@
          $notes | Set-Content release-notes.md -Encoding utf8
          gh release create $tag --draft --target '${{ github.sha }}' --title "ScreenTranslate DeskHub $env:RELEASE_VERSION" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          gh release upload $tag artifacts/releases/ScreenTranslate-win-Setup.exe artifacts/releases/ScreenTranslate-win-Setup.exe.sha256 "artifacts/releases/ScreenTranslate-$($env:RELEASE_VERSION)-full.nupkg" artifacts/releases/releases.win.json artifacts/releases/RELEASES
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; draft remains unpublished' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
